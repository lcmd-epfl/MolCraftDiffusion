name: Build and Deploy Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install doc dependencies
        run: pip install -r docs/requirements.txt

      - name: Validate documented config references
        run: python scripts/check_docs_references.py

      - name: Build user-facing docs strictly
        run: MOLCRAFT_DOCS_USER_ONLY=1 sphinx-build -W --keep-going -b html docs/ docs/_build/user-html

      - name: Build complete HTML docs
        run: sphinx-build --keep-going -b html docs/ docs/_build/html

      - name: Check documentation links
        run: MOLCRAFT_DOCS_USER_ONLY=1 sphinx-build -W --keep-going -b linkcheck docs/ docs/_build/linkcheck

      # Only deploy on pushes to main (not on PRs)
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          publish_branch: gh-pages
