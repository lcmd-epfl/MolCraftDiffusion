# Tutorial 5: Unconditional Molecule Generation
# Usage: MolCraftDiff generate docs/cfg_examples/gen_unconditional
#
# Samples molecules from a trained diffusion model with no constraints.

defaults:
  - data: mol_dataset
  - tasks: diffusion
  - interference: gen_unconditional
  - _self_

chkpt_directory: "training_outputs/benchmark/EDM_qm9/"  # <-- path to your trained model
atom_vocab: [H, B, C, N, O, F, Al, Si, P, S, Cl, As, Se, Br, I, Hg, Bi]
diffusion_steps: 900

interference:
  _target_: MolecularDiffusion.runmodes.generate.GenerativeFactory
  task_type: unconditional
  sampling_mode: "ddpm"   # "ddim" is faster (can skip steps)
  num_generate: 100
  batch_size: 12
  max_mol_size: 100
  mol_size: [0, 0]        # [N] fixed size; [N1, N2] sample uniformly in range
  target_values: []
  property_names: []
  seed: 86
  output_path: "${chkpt_directory}/output"
