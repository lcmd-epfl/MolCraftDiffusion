# MolCraftDiffusion model zoo manifest.
#
# Two layers:
#   assets:  the FETCH unit. Flat, keyed <group>/<name>, ALWAYS a directory.
#            Every file in one entry lands in the same directory, which is
#            what preserves the sidecar co-location contract that
#            cli/generate.py depends on.
#   models:  the DISCOVERY layer. Cards, tags, variants, example configs.
#
# Groups are logical, not per-model: `shared/qm9` is as valid a group as
# `kgdiff`. Data is frequently shared across models -- express that with
# `alias:`, never by uploading a second copy. Verified real cases:
# ipdiff/data and diffsbdd/data are both byte-identical to kgdiff/data.
#
# HOSTING. `pregH/molcraft-zoo` (+ `-data`) on HuggingFace, both PRIVATE and
# both NEW -- the existing pregH/MolecularDiffusion repo is never written to.
# Private means fetching needs a token: assets.fetch() reads $HF_TOKEN, then
# $HUGGING_FACE_HUB_TOKEN, then ~/.cache/huggingface/token.
#
# REDISTRIBUTION. `redistribute: false` entries carry NO `host:` field, so the
# staging step cannot upload them by accident. They ship a recipe instead
# (upstream URL + conversion script + sha256); `zoo recipe <asset>` prints it
# and `zoo verify` checks the result once built locally. Eight assets are
# withheld -- see notes/zoo_cannot_publish.md for why, and which to retrain.
#
# Generated by scripts/build_zoo_manifest.py + the licence audit of
# 2026-08-21 (notes/zoo_licence_audit.md). Add a model with
# `MolCraftDiff zoo add <model> ...`; `MolCraftDiff zoo verify --all` fails
# on any unaudited TODO and belongs in `just check`.

schema: 1
hosting:
  private: true
  models:
    repo: pregH/molcraft-zoo
    kind: model
  datasets:
    repo: pregH/molcraft-zoo-data
    kind: dataset
  url: https://huggingface.co/{prefix}{repo}/resolve/{rev}/{path}
