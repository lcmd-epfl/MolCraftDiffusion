      repo: https://github.com/deepprinciple/react-ot
      commit: 6dfccd0112cf6b504da80ad2516ff8e5ab8bade1
      corpus: https://gitlab.com/matschreiner/Transition1x
      download: https://zenodo.org/records/13131875
      doi: 10.5281/zenodo.13131875
      source: 'FETCHED from Zenodo record 13131875: train_rpsb_all.pkl (55,458,032 B, md5 701a4576...) and
        valid_rpsb_all.pkl (55,263,120 B, md5 b9ca5d76...), 110,721,152 B total. These are React-OT''s own
        authoritative pickles, the exact filenames pl_trainer.py:881,891 names.'
      script: docs/model_integrations/reactot/scripts/convert_dataset.py
      note: 'A SECOND VIEW OF THE SAME CORPUS AS data/transition1x/reactions, NOT A DUPLICATE, and the two
        are NOT interchangeable for React-OT -- registered separately for that measured reason. Same 10,073
        reactions, same molecules to machine precision (per-object Kabsch RMSD max 2.1e-14 A across all
        rows, so neither file has different chemistry), but the rpsb files pose reactant, TS and product
        in a MUTUALLY ALIGNED frame (''rpsb'' = reactant/product prepared for the Schrodinger bridge): no
        single rotation aligns all three in the t1x_source files, and the joint R|TS|P Kabsch RMSD between
        the families is 0.088-0.107 A mean, up to 1.8 A. For OA-ReactDiff that is pure gauge and invisible
        -- RePaint keeps a separate SE(3) frame per object. For React-OT it is DATA, because the bridge
        starts from x1 = (r_pos + p_pos)/2, which mixes the two frames: substituting perturbs the starting
        structure by 0.031-0.039 A mean and up to 1.4 A, against a midpoint only ~0.4 A from the true TS
        and a model reporting 0.09 A median RMSD -- the perturbation is the size of the quantity being measured.
        CONVERSION IS REQUIRED, not a copy: the Zenodo pickles carry no `smi` and no `ediff`, both of which
        data/component/oareactdiff_data.py:225-228 reads for every item, so a raw *_rpsb_all.pkl raises
        KeyError: ''smi'' on row 0. The converter derives ediff from the fetched files'' OWN DFT energies
        (E(object) - E(transition_state)) and cross-checks against the in-tree values at max |delta| = 0.0,
        and copies smi BY ROW INDEX from data/transition1x/reactions -- sound only because row alignment
        is PROVED first: rxn ids, use_ind, single_fragment, num_atoms and all atomic numbers are identical
        on all 10,073 rows of both splits. Nothing else is touched and no coordinate is modified. ONE corpus,
        two index-carrying views: both files hold all 10,073 reactions and differ only in the use_ind list
        each carries, so the published split lives INSIDE the files and use_by_ind: true is what applies
        it. React-OT trains with single_frag_only: FALSE (unlike OA-ReactDiff), giving 9,000 train / 1,073
        held-out reactions. R/TS/P share atom count AND ordering on all 10,073 rows. Elements {H,C,N,O};
        F is in the model''s vocabulary but absent from the corpus.'
models:
  apo2mol:
    family: pocket-conditioned-diffusion
    task_type: diffusion_apo2mol
    tags:
    - pocket-conditioned
    - apo-to-holo
    - co-generates-pocket
    variants:
      default:
        checkpoint: apo2mol/pretrained
        extra:
          pminet: apo2mol/pminet
        data: inputs/apo2mol/8tv6
    summary: "Apo2Mol (AAAI 2026, arXiv 2511.14559) \u2014 de-novo 3D ligand design conditioned on an\
      \ **apo** (ligand-free) pocket, jointly generating the ligand *and* a holo-like pocket conformation.\
      \ It is the only pocket model in this repo that emits a co-generated pocket."
  diffdec:
    family: scaffold-decoration
    task_type: diffusion_diffdec
    tags:
    - scaffold-decoration
    - pocket-conditioned
    - r-group
    variants:
      default:
        checkpoint: diffdec/pretrained
        data: data/crossdocked/diffdec
    summary: 'DiffDec performs scaffold decoration: given a scaffold, an anchor atom and a protein pocket,
      it grows the R-group. Architecturally a fork of DiffLinker, so it shares that model package with
      the scaffold/R-group naming swapped in.'
  diffint:
    family: pocket-conditioned-diffusion
    task_type: diffusion_diffint
    tags:
    - pocket-conditioned
    - hbond-guided
    variants:
      default:
        checkpoint: diffint/pretrained
        data: data/crossdocked/diffint
    summary: DiffInt is DiffSBDD's pocket-conditioned DDPM with explicit hydrogen-bond interaction pseudo-atoms
      added to the pocket representation. Its entire contribution is a data-layer trick, not an architecture
      change -- the backbone is reused verbatim.
  difflinker:
    family: fragment-linking
    task_type: diffusion_difflinker
    tags:
    - fragment-linking
    - outpainting
    variants:
      default:
        data: data/zinc/difflinker
    summary: DiffLinker generates the 3D linker that joins a set of given molecular fragments, keeping
      the fragment atoms fixed and growing only the connecting atoms.
  diffpharma:
    family: pocket-conditioned-diffusion
    task_type: diffusion_diffpharma
    tags:
    - pocket-conditioned
    - pharmacophore
    variants:
      default:
        checkpoint: diffpharma/pretrained
        data: data/crossdocked/diffpharma
    summary: "DiffPharma is a pocket-conditioned E(3)-equivariant diffusion model whose denoiser runs\
      \ over **four** node sets \u2014 ligand (noised), full-atom pocket, H-bond pseudo-particles (`interh`),\
      \ hydrophobic pseudo-particles (`interhp`) \u2014 with only the ligand noised. Integrated as a whole\
      \ new architecture + task (docs/adding_new_models.md \xA72), with **no core file modified**."
  diffsbdd:
    family: pocket-conditioned-diffusion
    task_type: diffusion_diffsbdd
    tags:
    - pocket-conditioned
    - inpainting
    - joint
    variants:
      fullatom_cond:
        data: data/crossdocked/pockets10a
        checkpoint: diffsbdd/fullatom_cond
      fullatom_joint:
        data: data/crossdocked/pockets10a
        checkpoint: diffsbdd/fullatom_joint
      fullatom_joint_moad:
        data: data/crossdocked/pockets10a
        checkpoint: diffsbdd/fullatom_joint_moad
    summary: 'DiffSBDD is a pocket-conditioned E(3)-equivariant DDPM over 3D point clouds (coordinates
      + 10-class element one-hot, heavy atoms only, no bonds). Both of its generative modes are ported:
      `pocket_conditioning` (`ConditionalDDPM`, the pocket is clean context) and `joint` (`EnVariationalDiffusion`,
      ligand and pocket diffused together), plus RePaint-style `inpaint()` in both modes for scaffold
      hopping / linker design.'
  diffsmol:
    family: shape-conditioned-diffusion
    task_type: diffusion_diffsmol
    tags:
    - shape-conditioned
    - cfg
    variants:
      default:
        data: data/qm9/ase-300
        checkpoint: diffsmol/pretrained
        extra:
          reference_shape: inputs/diffsmol/shapes
    summary: 'DiffSMol is a shape-conditioned hybrid DDPM: continuous Gaussian diffusion on positions
      plus discrete D3PM categorical diffusion on atom types, conditioned on a 128x3 vector-neuron shape
      latent via classifier-free guidance. Bonds and aromaticity were dropped by the approved gate resolution
      (FlowMol precedent); shape conditioning was kept and is the user''s primary requirement.'
  ditmc:
    family: conformer-generation
    task_type: diffusion_ditmc
    tags:
    - conformer
    - flow-matching
    - equivariant
    variants:
      ape:
        data: data/geom/graph3d-multiconf-qm9
        checkpoint: ditmc/ape
      rpe:
        data: data/geom/graph3d-multiconf-qm9
        checkpoint: ditmc/rpe
      so3:
        data: data/geom/graph3d-multiconf-qm9
        checkpoint: ditmc/so3
    summary: "DiTMC is a **conformer generator**, not a de novo generator. You hand it a molecule you\
      \ already have \u2014 its atoms and bonds \u2014 and it returns 3D conformers of *that* molecule.\
      \ All three published variants (`dit_ape`, `dit_rpe`, `dit_so3`) were reimplemented in PyTorch,\
      \ including the `e3x` surface `dit_so3` depends on."
  equifm:
    family: flow-matching
    task_type: diffusion_equifm
    tags:
    - unconditional
    - flow-matching
    - qm9
    variants:
      default:
        checkpoint: equifm/pretrained
    summary: 'EquiFM (MolFM) is equivariant flow matching with hybrid probability transport: an optimal-transport
      path for coordinates and a variance-preserving path for atom features, integrated with a fixed-step
      RK4 solver.'
  flowmol_graph3d:
    family: bond-generating-flow
    task_type: diffusion_flowmol_graph3d
    tags:
    - unconditional
    - bond-generating
    - ctmc
    - geom
    variants:
      default:
        checkpoint: flowmol_graph3d/pretrained
    summary: FlowMol3 is a bond-generating flow-matching model over GEOM-Drugs, using CTMC masking interpolants
      with self-conditioning and fake atoms. It emits an explicit bond table alongside coordinates, so
      samples need no bond perception.
  gcdm:
    family: equivariant-diffusion
    task_type: diffusion
    tags:
    - unconditional
    - property-optimization
    - gcpnet
    variants:
      geom_uncond:
        checkpoint: gcdm/geom_uncond
      qm9_alpha:
        checkpoint: gcdm/qm9_alpha
      qm9_uncond:
        checkpoint: gcdm/qm9_uncond
    summary: GCDM is geometry-complete diffusion built on a GCPNet backbone. Because it plugs into the
      platform's own diffusion task, it inherits property conditioning, CFG, gradient guidance and inpainting
      -- more generation modes than the source repo itself offers, plus a property-optimization run mode.
  ipdiff:
    family: pocket-conditioned-diffusion
    task_type: diffusion_ipdiff
    tags:
    - pocket-conditioned
    - interaction-prior
    variants:
      default:
        checkpoint: ipdiff/pretrained
        extra:
          ipnet: ipdiff/ipnet
        data: data/crossdocked/pockets10a
    summary: 'IPDiff is TargetDiff''s pocket-conditioned DDPM plus a *frozen pretrained interaction prior*
      (IPNet/BAPNet): the prior''s 128-d node features are concatenated into the denoiser''s token embeddings
      ("prior conditioning") and drive a learned shift term `k_t * shift_t_mlp_pos([h_bap_lig, t])` inside
      the forward noising process and the reverse posterior ("prior shifting"). At sampling time the prior
      is re-run on the current predicted x0 every reverse step, so each step costs roughly two forward
      passes.'
  kgdiff:
    family: pocket-conditioned-diffusion
    task_type: diffusion_kgdiff
    tags:
    - pocket-conditioned
    - property-guided
    variants:
      default:
        checkpoint: kgdiff/pretrained
        data: data/crossdocked/pockets10a
    summary: KGDiff = TargetDiff + a per-atom affinity ("value") head that acts as its own classifier
      guide during sampling. Pocket-conditioned ligand generation, one checkpoint for both denoising and
      guidance.
  ligandiff:
    family: metal-complex-diffusion
    task_type: diffusion_ligandiff
    tags:
    - transition-metal
    - ligand-regeneration
    variants:
      default:
        checkpoint: ligandiff/pretrained
        data: data/tmc/ligandiff
    summary: LigandDiff (JCTC 2024) regenerates one ligand of a 3D transition-metal complex while holding
      the metal and the remaining ligands fixed. It is a fork of DiffLinker's EDM stack, so the already-integrated
      `modules/tasks/diffusion_difflinker.py` served as the template.
  ligandiff_multi:
    family: metal-complex-diffusion
    task_type: diffusion_ligandiff_multi
    tags:
    - transition-metal
    - multi-ligand
    - octahedral
    variants:
      default:
        checkpoint: ligandiff_multi/pretrained
        data: data/tmc/ligandiff-multi
    summary: multi-LigandDiff regenerates several ligands at once around a fixed transition-metal centre,
      from replacing two ligands up to building a whole octahedral coordination sphere. It reuses the
      LigandDiff model package unchanged.
  loqi:
    family: conformer-generation
    task_type: diffusion_loqi
    tags:
    - conformer
    - stereochemistry
    - chembl
    variants:
      flow:
        data: data/chembl3d/stereo-200
        checkpoint: loqi/flow
      pretrained:
        data: data/chembl3d/stereo-200
        checkpoint: loqi/pretrained
    summary: 'Two variants shipped from one task module, one per released checkpoint: `diffusion_loqi`
      (VDM diffusion, 25 steps, self-conditioning) and `diffusion_loqi_flow` (continuous flow matching,
      velocity prediction, rigid OT).'
  midi:
    family: bond-generating-diffusion
    task_type: diffusion_midi
    tags:
    - unconditional
    - bond-generating
    - qm9
    variants:
      default:
        checkpoint: midi/pretrained
        data: data/qm9/graph3d-4k
    summary: "MiDi is the first model in this platform that **generates the molecular graph itself** \u2014\
      \ bond orders and formal charges are diffused jointly with the 3D coordinates, so a sample arrives\
      \ with an explicit bond table instead of needing post-hoc perception (xyz2mol / OpenBabel)."
  nextmol:
    family: llm-plus-diffusion
    task_type: diffusion_nextmol
    tags:
    - de-novo
    - conformer
    - selfies-llm
    variants:
      default:
        checkpoint: nextmol/pretrained
        extra:
          mollama: nextmol/mollama
        data: data/geom/graph3d-multiconf-qm9
    summary: NExT-Mol pairs a 1D molecular language model (MoLlama, which proposes a molecule as a SELFIES
      string) with DMT, a diffusion transformer that predicts that molecule's 3D conformer. Only the 3D
      half was converted; MoLlama is used as published.
  pmdm:
    family: pocket-conditioned-diffusion
    task_type: diffusion_pmdm
    tags:
    - pocket-conditioned
    - dual-scale
    variants:
      default:
        checkpoint: pmdm/pretrained
        data: data/crossdocked/pmdm
    summary: "PMDM is integrated **as intended \u2014 pocket-conditioned, structure-based 3D molecular\
      \ generation**. The ligand point cloud is the diffused variable; the protein pocket point cloud\
      \ is a fixed conditioning input carrying genuine CrossDocked pocket data (element, amino-acid type,\
      \ backbone flag). No dummy pocket, no degenerate unconditional mode."
  silvr:
    family: sampling-method
    task_type: (interference only)
    tags:
    - guidance
    - reference-conditioned
    variants:
      default:
        data: inputs/silvr/reference
    summary: 'SILVR is **not a new model or backbone**. It is an inference-time guidance / generation
      method layered on the existing EDM (`EnVariationalDiffusion` + `GeomMolecularGenerative`). It adds
      no network, no loss, no dataset and no `tasks.task_type`; it adds one new `interference.task_type:
      silvr`.'
  edm-qm9:
    family: equivariant-diffusion
    task_type: diffusion
    tags:
    - unconditional
    - qm9
    variants:
      default:
        checkpoint: edm/qm9
  edm-geom:
    family: equivariant-diffusion
    task_type: diffusion
    tags:
    - unconditional
    - geom
    variants:
      default:
        checkpoint: edm/geom
  edm-formed-energyscore:
    family: equivariant-diffusion
    task_type: diffusion
    tags:
    - cfg
    - property-conditioned
    variants:
      default:
        checkpoint: edm/formed-energyscore
  edm-iflp-outpaint:
    family: equivariant-diffusion
    task_type: diffusion
    tags:
    - outpainting
    - mof
    variants:
      default:
        checkpoint: edm/iflp-outpaint
  edm-fm:
    family: equivariant-diffusion
    task_type: diffusion
    tags: []
    variants:
      default:
        checkpoint: edm/fm
  adit-geom:
    family: latent-diffusion
    task_type: diffusion_adit
    tags:
    - latent
    - geom
    variants:
      default:
        checkpoint: adit/geom
  tabasco-geom:
    family: transformer-diffusion
    task_type: diffusion_tabasco
    tags:
    - unconditional
    - geom
    - fast
    variants:
      default:
        checkpoint: tabasco/geom
  shepherd-gdb17:
    family: pharmacophore-diffusion
    task_type: diffusion_pharmacophore
    tags:
    - pharmacophore
    - shape
    - electrostatics
    variants:
      default:
        checkpoint: shepherd/gdb17
  regressor-formed-s1t1:
    family: property-prediction
    task_type: regression
    tags:
    - regression
    - formed
    variants:
      default:
        checkpoint: regressor/formed-s1t1
  guidance-formed-s1t1:
    family: property-guidance
    task_type: guidance
    tags:
    - guidance
    - formed
    variants:
      default:
        checkpoint: guidance/formed-s1t1
  jodo:
    family: bond-generating-diffusion
    task_type: diffusion_jodo
    tags:
    - unconditional
    - property-conditional
    - bond-generating
    - qm9
    - geom
    variants:
      default:
        checkpoint: jodo/pretrained
        data: data/qm9/graph3d
        configs:
        - jodo_generate.yaml
      cond_gap:
        checkpoint: jodo/cond_gap
        data: data/qm9/graph3d-targets
        configs:
        - jodo_cond_generate.yaml
      geom_uncond:
        checkpoint: jodo/geom_uncond
        data: data/geom/graph3d-val
    summary: JODO diffuses coordinates, atom types, formal charges AND bond orders jointly in one continuous
      process, so a sample arrives with its bond table already drawn. It is the bond-generating model
      that holds up when the sampling budget is cut (upstream reports 1000 steps down to ~50), and the
      only one here that also generates to a requested QM9 property value. The GEOM variant is converted
      and verified tensor-for-tensor, and generates drug-sized molecules (33-51 atoms, 4/4 valid on a
      50-step check).
  etflow:
    family: conformer-generation
    task_type: diffusion_etflow
    tags:
    - conformer
    - flow-matching
    - equivariant
    - geom-drugs
    - qm9
    variants:
      drugs-o3:
        checkpoint: etflow/drugs_o3
        data: data/geom/graph3d-multiconf-drugs
        configs:
        - etflow_generate.yaml
      qm9-o3:
        checkpoint: etflow/qm9_o3
        data: data/geom/graph3d-multiconf-qm9
    summary: ET-Flow is a conformer generator, not a de novo generator -- you hand it a molecule's atoms
      and bonds and it returns 3D conformers of that molecule. Equivariant flow matching from a harmonic
      prior, ~8.3M params. Both published o3 variants are converted tensor-for-tensor (488/488 drugs-o3,
      492/492 qm9-o3). drugs-o3 is the default, for drug-like molecules over the 16-element vocab; qm9-o3
      covers small C/N/O/F molecules and scored 0.029 A median RMSD on held-out QM9. drugs-so3 is deliberately
      not shipped -- upstream's yaml and its loader schema disagree about post-hoc parity switching. One
      connected molecule at a time -- a salt or multi-fragment input makes the harmonic prior diverge,
      usually without raising. Training on GEOM-Drugs needs a Drugs db you build yourself; the bundled
      train config reads the QM9 corpus above.
  syncogen:
    family: synthesizable-generation
    task_type: diffusion_syncogen
    tags:
    - synthesizable
    - building-blocks
    - unconditional
    - pharmacophore
    - flow-matching
    variants:
      default:
        checkpoint: syncogen/pretrained
        extra:
          vocabulary: syncogen/vocabulary
        configs:
        - syncogen_generate.yaml
      pharmacophore:
        checkpoint: syncogen/pharm
        extra:
          vocabulary: syncogen/vocabulary
        data: inputs/syncogen/reference
        configs:
        - syncogen_pharm_generate.yaml
      train-2k:
        data: data/synspace/2k
        extra:
          vocabulary: syncogen/vocabulary
        configs:
        - syncogen_train.yaml
    summary: 'SynCoGen (arXiv 2507.11818) is the only model here whose output comes with a recipe: every
      molecule is assembled from catalogue building blocks joined by real reactions, so what you get is
      something you can order and make. Nodes are building blocks and edges are reaction identities --
      masked (absorbing) discrete diffusion over that graph, run jointly with flow matching over atom
      coordinates, and chemical bonds are DERIVED by RDKit assembly at the end rather than generated.
      Two released checkpoints, two task_types: `diffusion_syncogen` (unconditional) and `diffusion_syncogen_pharm`
      (conditioned on one reference ligand''s pharmacophores; not CFG -- the points enter as extra virtual
      nodes). Molecules top out at five building blocks and are limited to the 93-block, 19-reaction catalogue.
      NOTE: `syncogen/vocabulary` is required to instantiate either checkpoint and is NOT redistributable
      -- build it locally with `MolCraftDiff zoo recipe syncogen/vocabulary`.'
  oareactdiff:
    family: reaction-diffusion
    task_type: diffusion_oareactdiff
    tags:
    - transition-state
    - reaction-conditioned
    - object-aware
    - inpainting
    variants:
      default:
        checkpoint: oareactdiff/pretrained
        data: data/transition1x/reactions
        configs:
        - oareactdiff_generate.yaml
  reactot:
    family: reaction-diffusion
    task_type: diffusion_reactot
    tags:
    - transition-state
    - reaction-conditioned
    - object-aware
    - schrodinger-bridge
    - optimal-transport
    - deterministic
    variants:
      default:
        checkpoint: reactot/pretrained
        data: data/transition1x/reactions_rpsb
        configs:
        - reactot_generate.yaml
    summary: 'React-OT (Duan, Liu, Du, ..., Kulik, Nature Machine Intelligence 2025, doi:10.1038/s42256-025-01010-0;
      preprint arXiv:2404.13430 under a different title) generates the transition state of an elementary
      reaction from its reactant and product geometries. It is the successor to oareactdiff and shares that
      model''s object-aware LEFTNet backbone and Transition1x corpus, but it is NOT a diffusion model: it
      integrates a Schrodinger bridge / optimal-transport process from the R/P midpoint (r_pos + p_pos)/2
      to the TS, so the `diffusion_` task_type prefix is a platform naming convention, not a claim about
      the objective. THE MODEL IS DETERMINISTIC (ot_ode: true, sigma: 0.0 -- no Gaussian is drawn anywhere),
      so ONE SAMPLE IS THE ANSWER: num_generate: 20 returns twenty identical files, and there is no best-of-N
      to rank and no confidence model to rank it with, which is the paper''s central claim. pos_only --
      it predicts coordinates and copies atom identities from the input reaction, so there is no unconditional
      mode and you must supply a reaction. `num_steps` IS upstream''s --nfe, the number of network evaluations;
      10 is the documented default and accuracy is flat from there to 100. Requires data/transition1x/reactions_rpsb
      specifically -- see that asset''s note for why the sibling data/transition1x/reactions is NOT a valid
      substitute for this model.'
