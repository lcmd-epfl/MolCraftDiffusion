# Transition1x reactions for OA-ReactDiff, read straight from upstream's own
# preprocessed pickles. There is no conversion step and no ASE db: the data
# module (data/component/oareactdiff_data.py) reads the .pkl directly.
#
# THE SPLIT IS INSIDE THE FILES, NOT BETWEEN THEM. The train and valid
# pickles contain the SAME 10,073 reactions; they differ only in
# the `use_ind` list each carries (9,000 vs 1,073). So `use_by_ind: true` is
# what actually separates train from validation -- with it false, or with
# both paths pointing at one file, you validate on training reactions.
# Intersected with single_fragment: 6,733 train / 783 valid reactions,
# doubled by swapping_react_prod.
#
# Upstream ships no test.pkl, so test_set reuses the validation split.
_target_: MolecularDiffusion.data.component.oareactdiff_data.OAReactDiffDataModule

train_pkl: ???
# null => reuse train_pkl (and warn, because that is almost never wanted).
valid_pkl: null

# --- upstream's dataset filters, at their released settings ------------ #
# Keep only reactions whose reactant and product are each one connected
# fragment.
single_frag_only: true
# Also train on every reaction backwards (product -> reactant, same TS).
# Doubles the set; the released checkpoint was trained with it on.
swapping_react_prod: true
# Honour the published 9,000 / 1,073 split. See the note above.
use_by_ind: true
# Subtract each object's own centre of mass. Effectively mandatory: the
# diffusion process lives on the zero-CoM subspace PER OBJECT, which is what
# lets reactant, TS and product keep independent SE(3) frames.
center: true
# The ninth feature column is the ATOMIC NUMBER, not a formal charge
# (upstream's `charges` key holds Z). Zeroing it contradicts the released
# weights; only meaningful when training from scratch.
zero_charge: false

# null = every reaction; set an int to cap each split (smoke tests).
limit: null

batch_size: 14
num_workers: 0

# --- keys cli/train.py reads off cfg.data ------------------------------ #
# Output atom vocabulary, in the column order of ATOM_MAPPING
# (base_dataset.py:9-15). F is in the vocabulary but absent from Transition1x.
atom_vocab: [H, C, N, O, F]
# The Reaction dataclass exposes no `node_feature`/`x`, so train.py infers
# n_dim = 0; with use_ohe_feature false the base feature dim is 0 too, so no
# spurious extra_norm_values are injected into the task.
use_ohe_feature: false
allow_unknown: false
node_feature_choice: null

# Documentation only -- nothing dispatches on it. runmodes/train/data.py's
# DataModule (the only thing that switches on data_type) is bypassed
# entirely, because cfg.data._target_ names our datamodule directly. The name
# is shared rather than model-specific because the container it describes
# (data/component/reaction_data.py) is shared: a reactant side, a product
# side, and a transition-state target.
data_type: reaction
