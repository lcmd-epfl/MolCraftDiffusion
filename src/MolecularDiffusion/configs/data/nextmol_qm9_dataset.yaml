# graph3d data for NExT-Mol's DMT. Bonds are CONDITIONING here, never generated.
#
# Build the db first:
#   MolCraftDiff data import-graph3d qm9 <raw_dir> data/qm9_graph3d.db
# or, for the multi-conformer set DMT actually wants (it learns an ENSEMBLE,
# and the bundled importers keep one conformer per molecule):
#   python docs/model_integrations/ditmc/scripts/convert_dataset.py \
#       --mode geom --source <path>/rdkit_folder/qm9 --out data/nextmol_qm9_30conf.db
#
# kekulize MUST stay false: aromatic is a real class in NExT-Mol's 4-wide bond
# vocabulary. Kekulizing would push aromatic bonds into the SINGLE/DOUBLE
# columns and change the conditioning distribution the weights were trained on.
_target_: MolecularDiffusion.runmodes.train.DataModule

root: data/
filename: null
ase_db_path: ${asset:data/geom/graph3d-multiconf-qm9/geom_qm9_multiconf.db}
# Cache is keyed on this name (`processed_data_<name>_graph3d.pt`);
# it changed with the db so the old single-conformer cache is not
# silently reused (and stays valid for anything still using that db).
dataset_name: nextmol_geom_qm9_multiconf

atom_vocab: [H, C, N, O, F]
with_hydrogen: True          # DMT is all-atom
use_ohe_feature: True
allow_unknown: False
node_feature_choice: null
use_row_data_features: false
max_atom: 29
forbidden_atom: []

data_type: graph3d

# --- graph3d-specific ------------------------------------------------------
bond_collate: raw            # PyG Batch; the task's adapter rebuilds upstream's
                             # directed both-directions edge list from it
center_coords: True
graph3d_stats: False         # DMT needs NO dataset statistics at construction;
                             # pos_std is a config scalar, not a computed stat
kekulize: False              # <- see the header
use_stored_split: True

# --- shared DataModule knobs ---------------------------------------------
train_ratio: 0.8
batch_size: 32               # the in-model node-pair graph is COMPLETE, so
                             # memory grows as N^2. 32 is safe for QM9 (N<=29);
                             # drop sharply for GEOM-Drugs.
num_workers: 0
data_efficient_collator: False
load_pkl: null
save_pkl: null
chunk_size: null

# Present for schema parity with the point-cloud configs; unused here.
xyz_dir: null
coord_file: null
natoms_file: null
edge_type: fully_connected
radius: 4.0
n_neigh: 5
compact_drop_edge_index: false
compact_drop_tags: false
compact_pack_ohe: false
compact_int8_z: false
