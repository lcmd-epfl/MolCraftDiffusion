# graph3d data for ET-Flow. Bonds are CONDITIONING here, never generated.
#
# Defaults to the MULTI-CONFORMER GEOM-QM9 db, which is what ET-Flow actually
# wants: 988,850 rows over ~133k molecules, mean 8.3 conformers each, 80.6% of
# molecules carrying more than one geometry. The conformational distribution IS
# the training signal for this model family -- a one-conformer db converges to
# something that emits a single plausible pose per input and scores poorly on
# ensemble coverage (COV/MAT).
#
# Build it with:
#   curl -sL "https://dataverse.harvard.edu/api/access/datafile/4327252" \
#       | tar -xf - -C <raw_dir>          # 50.1 GB, served UNcompressed
#   python scripts/build_geom_multiconf.py \
#       --source <raw_dir>/rdkit_folder/qm9 \
#       --out data/geom_qm9_multiconf.db --max-conformers 30
#
# Conformers are kept top-30 by Boltzmann weight, as upstream does. The split is
# a deterministic 80/10/10; pass --split-npy to honour torsional diffusion's
# published split instead (a separate download). Which one was used is recorded
# in the db metadata, so a run can never silently claim a fidelity it lacks.
#
# For the single-conformer de novo corpus instead (smoke tests only):
#   MolCraftDiff data import-graph3d qm9 <raw_dir> data/qm9_graph3d.db
#
# kekulize MUST stay false. ET-Flow's network never sees a bond ORDER -- its
# edge channel is a bare bonded/not-bonded flag -- so aromaticity reaches it
# ONLY through the atom features (`atom.GetIsAromatic()` and the hybridization
# column, commons/utils.py:97-105). Kekulizing would zero that column and shift
# hybridization for every ring atom, i.e. change the conditioning distribution
# the published weights were trained on.
_target_: MolecularDiffusion.runmodes.train.DataModule

root: data/
filename: null
ase_db_path: data/geom_qm9_multiconf.db
# NOTE: the preprocessed cache is keyed on this name
# (`processed_data_<dataset_name>_graph3d.pt`). It changed with the switch
# to the multi-conformer db -- reusing `etflow_qm9` would have silently
# loaded the old single-conformer cache instead of the new corpus.
dataset_name: etflow_geom_qm9_multiconf

atom_vocab: [H, C, N, O, F]
with_hydrogen: True          # ET-Flow is all-atom; hydrogens carry the geometry
use_ohe_feature: True
allow_unknown: False
node_feature_choice: null
use_row_data_features: false
max_atom: 29
forbidden_atom: []

data_type: graph3d

# --- graph3d-specific ------------------------------------------------------
# raw -> PyG Batch. The task's adapter mirrors the stored upper triangle into
# the flat bidirectional edge list ET-Flow wants; a dense (B,N,N) matrix would
# be the wrong shape entirely.
bond_collate: raw
center_coords: True
graph3d_stats: False         # ET-Flow needs NO dataset statistics at all
kekulize: False              # <- see the header
use_stored_split: True

# --- shared DataModule knobs ---------------------------------------------
train_ratio: 0.8
# The transformer attends over bonds + a 10 A radius graph capped at 32
# neighbours, so cost grows with atoms, not with N^2 pairs. 64 is upstream's
# own drugs-o3 batch size; 128 is what qm9-o3 used.
batch_size: 64
num_workers: 0
data_efficient_collator: False
load_pkl: null
save_pkl: null
chunk_size: null

# Present for schema parity with the point-cloud configs; unused here.
xyz_dir: null
coord_file: null
natoms_file: null
edge_type: fully_connected
radius: 4.0
n_neigh: 5
compact_drop_edge_index: false
compact_drop_tags: false
compact_pack_ohe: false
compact_int8_z: false
