# 3D molecular graph with EXPLICIT BONDS (data_type: graph3d).
#
# Build the db first:
#   MolCraftDiff data import-graph3d qm9 <raw_dir> data/qm9_graph3d.db
#
# Bond classes: 0=none 1=SINGLE 2=DOUBLE 3=TRIPLE 4=AROMATIC.
# Class 0 is never stored; absence from bond_index means "no bond".
_target_: MolecularDiffusion.runmodes.train.DataModule

root: data/
filename: null
ase_db_path: data/qm9_graph3d.db
dataset_name: qm9_midi

# MiDi's QM9 full_atom_encoder order (qm9_dataset.py:35).
atom_vocab: [H, C, N, O, F]
with_hydrogen: True        # False -> heavy atoms only; bonds are remapped
use_ohe_feature: True
allow_unknown: False
node_feature_choice: null
use_row_data_features: false
max_atom: 29
forbidden_atom: []

data_type: graph3d

# --- graph3d-specific ------------------------------------------------------
# raw   -> PyG Batch (bond_index auto-increments); MiDi's to_dense and
#          FlowMol's build_edge_idxs both consume this directly.
# dense -> pre-padded (B,N,N) integer bond matrix, MiDi's PlaceHolder shapes.
bond_collate: raw
center_coords: True        # both MiDi and FlowMol want COM-centred coords
graph3d_stats: True           # marginals/valencies both models need at build time
kekulize: False            # True -> aromatic bonds to alternating single/double,
                           # reproducing MiDi's sanitize=False QM9 distribution
use_stored_split: True     # honour MiDi's published 100k/val/10% split

# --- shared DataModule knobs ---------------------------------------------
train_ratio: 0.8           # ignored while use_stored_split finds labels
batch_size: 64
num_workers: 0
data_efficient_collator: False
load_pkl: null
save_pkl: null
chunk_size: null           # set ~250000 for GEOM

# Present for schema parity with the point-cloud configs; unused here.
xyz_dir: null
coord_file: null
natoms_file: null
edge_type: fully_connected
radius: 4.0
n_neigh: 5
compact_drop_edge_index: false
compact_drop_tags: false
compact_pack_ohe: false
compact_int8_z: false
