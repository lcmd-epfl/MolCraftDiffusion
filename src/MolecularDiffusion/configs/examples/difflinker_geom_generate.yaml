# @package _global_
# Fragment/linker generation from DiffLinker's CONVERTED PRETRAINED weights --
# upstream `geom_difflinker.ckpt` (Zenodo record 7121300), trained on
# GEOM-DRUGS multi-fragment data WITHOUT anchor conditioning (the
# anchors-free counterpart of
# configs/difflinker_geom_given_anchors_generate.yaml -- same data, same
# architecture size, only the context channel differs).
#
#   MolCraftDiff generate configs/difflinker_geom_generate.yaml
#
# PREREQUISITE -- run once, if the converted checkpoint is not already there:
#
#   python docs/model_integrations/difflinker/scripts/convert_pretrained_checkpoint.py \
#       --variant geom
#
# See docs/model_integrations/difflinker/configs/difflinker_zinc_given_anchors_generate.yaml's
# header for what the conversion script does and proves (key-set/shape
# equality, strict=False missing/unexpected assertions, post-write
# byte-identity re-verification, delete-only-after-verified-conversion).
# This variant additionally downloads its own n_node_dist source,
# data/geom/geom_multifrag_test.pt (1290 molecules), from a Zenodo record
# DIFFERENT from the ZINC splits -- see INTEGRATION_PLAN.md's "Revision 4"
# section, "Data source for n_node_dist".
#
# WHAT THE MODEL CONDITIONS ON. A fixed set of fragment atoms (a plain .xyz
# file). GEOM adds a 9th atom type, phosphorus, over ZINC's 8-element vocab
# -- `atom_vocab` below MUST list it last (`GEOM_ATOM2IDX` in
# others/difflinker/src/const.py), since the one-hot column order backs
# `in_node_nf: 9`. DiffLinker has no unconditional mode, so generation is
# dispatched through the generic "outpaint" GenerativeFactory path
# (gen_outpaint.yaml). This checkpoint's `anchors_context: false` means the
# model was never trained to look at anchor atoms at all.
#
# KNOWN LIMITATION. `mol_size` is the TOTAL atom count (fragment + linker),
# not linker size alone -- see INTEGRATION_PLAN.md's "Post-Completion Fix"
# section for why setting mol_size below the reference fragment's own atom
# count produces degenerate linker_size==0 output. Below reuses the ZINC
# smoke test's reference_fragment.xyz (17 atoms, all-heavy elements it
# contains are a subset of this variant's 9-symbol vocab, so it loads fine
# even though it wasn't drawn from GEOM); this checkpoint's own n_node_dist
# (built from data/geom/geom_multifrag_test.pt's num_atoms field) covers
# total atom counts 19-45, so mol_size stays comfortably inside that range.

defaults:
  - tasks: diffusion_difflinker
  - interference: gen_outpaint
  - _self_

name: "difflinker_geom_generate"
chkpt_directory: ${asset:difflinker/pretrained/geom_difflinker.ckpt}
atom_vocab: [C, O, N, F, S, Cl, Br, I, P]
seed: 42

# Overrides the handful of fields that differ from
# src/MolecularDiffusion/configs/tasks/diffusion_difflinker.yaml's
# from-scratch smoke-test defaults, per INTEGRATION_PLAN.md's Phase A6
# table (n_layers: 6 already matches the base task yaml's default, so no
# override needed for it).
tasks:
  in_node_nf: 9
  anchors_context: false

interference:
  batch_size: 4
  num_generate: 20
  output_path: generated_difflinker_geom
  n_frames: 0
  mol_size: [20, 25]
  condition_configs:
    reference_structure_path: ${asset:inputs/difflinker/fragments/reference_fragment.xyz}
    # Bundled gen_outpaint.yaml defaults n_retrys: 3, which forces
    # batch_size back down to 1 (tasks_generate.py::structural_guidance,
    # "retry path requires one sample at a time"). DiffLinkerTask.sample()
    # doesn't implement the retry loop anyway (inert kwarg) so there's
    # nothing to lose by disabling it here to unlock real batching.
    n_retrys: 0
    # Pretrained released weights (tanh: false, unbounded per-layer coord
    # updates) sometimes diverge to NaN partway through the reverse-diffusion
    # chain -- a known, tolerated property of these checkpoints, not a
    # construction bug (INTEGRATION_PLAN.md Revision 6). This bounds a
    # full-restart retry loop around sampling, matching upstream's own
    # generate.py default of 5 attempts.
    outpaint_cfgs:
      max_generate_attempts: 5
