# @package _global_
# Fragment/linker generation from a real, working DiffLinker checkpoint
# trained by this project from scratch on ZINC fragment/linker/anchor data
# (configs/difflinker_train_zinc.yaml) -- NOT upstream's own released
# zinc_difflinker.ckpt, which was removed from the zoo after being found
# permanently broken for generation (tanh: false numerical instability,
# reproduced against unmodified upstream code -- see
# docs/model_integrations/difflinker/FINAL_REPORT.md). This checkpoint
# actually generates: 48-molecule smoke test, 45/48 (93.75%) clean, no
# atom clashes, 21 unique linker atom-compositions.
#
#   MolCraftDiff zoo fetch --model difflinker --variant zinc
#   MolCraftDiff generate examples/difflinker_zinc_generate.yaml
#
# Runs from any directory: every path below is an "asset" reference
# resolved against your local zoo cache ($MOLCRAFT_ASSETS, default
# ~/.cache/molcraft/zoo), not a path relative to the repo.
#
# WHAT THE MODEL CONDITIONS ON. A fixed set of fragment atoms (a plain .xyz
# file, ZINC's 8-element vocab: C,O,N,F,S,Cl,Br,I -- no H, no P). DiffLinker
# has no unconditional mode, so generation is dispatched through the generic
# "outpaint" GenerativeFactory path (gen_outpaint.yaml). No `tasks:` overrides
# are needed here -- this is a native platform-trained Lightning checkpoint,
# so `cli/generate.py` rebuilds the architecture from the checkpoint's own
# saved hyperparameters directly, unlike the old converted upstream weights.
#
# KNOWN LIMITATION. `mol_size` is the TOTAL atom count (fragment + linker),
# not linker size alone. Below reuses the same reference_fragment.xyz
# (17 atoms) as throughout this integration's testing; this checkpoint's own
# n_node_dist (built during training from the real ZINC data) covers a wide
# total-atom range, so mol_size stays comfortably inside it.
#
# Epoch 81/100 (global_step 533902, val_loss 0.042) as of registration --
# training may still be running; re-fetch if a later snapshot is registered.

defaults:
  - tasks: diffusion_difflinker
  - interference: gen_outpaint
  - _self_

name: "difflinker_zinc_generate"
chkpt_directory: ${asset:difflinker/trained/zinc_trained_difflinker.ckpt}
atom_vocab: [C, O, N, F, S, Cl, Br, I]
seed: 42

interference:
  batch_size: 8
  num_generate: 48
  output_path: generated_difflinker_zinc
  n_frames: 0
  mol_size: [20, 25]
  condition_configs:
    reference_structure_path: ${asset:inputs/difflinker/fragments/reference_fragment.xyz}
    # Bundled gen_outpaint.yaml defaults n_retrys: 3, which forces
    # batch_size back down to 1 (tasks_generate.py::structural_guidance,
    # "retry path requires one sample at a time"). DiffLinkerTask.sample()
    # doesn't implement the retry loop anyway (inert kwarg) so there's
    # nothing to lose by disabling it here to unlock real batching.
    n_retrys: 0
