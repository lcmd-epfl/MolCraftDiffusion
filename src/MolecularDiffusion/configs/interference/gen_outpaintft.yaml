_target_: MolecularDiffusion.runmodes.generate.GenerativeFactory
task_type: outpaintft
sampling_mode: "ddpm"
num_generate: 100
mol_size:  [76,76]
target_values: []
property_names: []
negative_target_values: []   # code default
batch_size: 1
seed: 86
n_frames: 0
max_mol_size: 0              # code default; 0 = no cap
save_xyzrender_figures: false # code default
output_path: generated_mol
condition_configs:
  reference_structure_path: ${asset:shared/templates/INT2_0.xyz}
  condition_component: xh            # code default
  use_noised_conditioning: false     # code default
  n_retrys: 0
  t_retry: 180
  outpaint_cfgs:
    t_start: 1
    t_critical: 0.05           # code default; scaffold coords are released for s < this
    connectors: {0: [0]}       # REQUIRED: {scaffold_atom_idx: [n_bonds]}, 0-indexed.
                               # This mode ignores n_bonds (no bonding constraint); use 0.
    # --- extra-node placement (code defaults) ---
    init_method: skeleton      # "skeleton" | "seed" | "fragment"
    skeleton_type: random_walk
    seed_dist: 2.0
    min_dist: 1.0
    spread: 1.0
    bond_len: 1.5
    forward_noise: jitter
    jitter_scale: 1.0         # explicit positional forward-noise magnitude
    n_bq_atom: 0
