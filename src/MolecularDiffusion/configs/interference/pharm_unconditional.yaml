_target_: MolecularDiffusion.runmodes.generate.tasks_generate.PharmacophoreConditionGenerator
task_type: unconditional
num_generate: 100
batch_size: 1
N_x1: 20         # number of atoms to generate
N_x4: 5          # number of pharmacophores to generate
num_steps: 400
prior_noise_scale: 1.0
denoising_noise_scale: 1.0
seed: 42
verbose: true
output_path: generated_pharm_unconditional
N_x1_sampling: uniform          # code default; "uniform" | "normal" (how N_x1 is drawn if a range)
save_xyzrender_figures: false   # code default
save_modalities: false          # code default
use_noised_conditioning: false  # code default

# --- Modality Generation Toggles ---
compute_x1: true
compute_x2: true
compute_x3: true
compute_x4: true
