# Conformer generation for molecules you supply (DiTMC).
#
# GenerativeFactory.sample(batch_size, nodesxsample, ...) has no channel for
# "which molecule", so this points at a dedicated generator, exactly as
# gen_diffdec_scaffold.yaml and gen_apo2mol_pocket.yaml do. cli/generate.py
# only calls `instantiate(cfg.interference, task=task)` then `.run()`, so every
# key here goes straight to that generator's __init__.
#
# DiTMCTask.sample() raises with a pointer back to this file -- there is no
# unconditional mode.
_target_: MolecularDiffusion.modules.tasks.diffusion_ditmc.DiTMCConformerGenerator

# CHOOSE AN INPUT -- exactly one of these.
#   smiles:  a SMILES string, a list of them, or a path to a file with one per
#            line. RDKit is used ONLY to get atoms and bonds; the coordinates
#            are what the model produces.
#   db_path: a graph3d ASE db (+ `indices`, a list of row numbers).
smiles: null
db_path: null
indices: null

num_generate: 5              # conformers per input molecule
batch_size: 8

# Euler steps from tau=0 to tau=1. Upstream's default is 50.
num_steps: 50
# Spend more steps near tau=1 (upstream's logarithmic schedule). Off by default.
logarithmic_time_bool: false

# Classifier-free guidance scale. Only meaningful if the checkpoint was TRAINED
# with tasks.flow.free_guidance_bool: true; 1.0 reproduces the unguided update
# exactly either way.
free_guidance_scale: 1.0

# Upstream's chirality parity correction, which flips generated coordinates to
# match the input mol's tetrahedral tags. DEFAULT OFF, matching
# generate_confs_main(..., use_correction=False).
use_chirality_correction: false

# >0 keeps the sampler trajectory (upstream's return_trajectory).
n_frames: 0

max_atom: 200
seed: 42
device: null                 # null => cuda if available
output_path: generated_ditmc
