_target_: MolecularDiffusion.runmodes.generate.GenerativeFactory
task_type: inpaint
sampling_mode: "ddpm"
num_generate: 100
mol_size:  [0,0]              # [0,0] = draw size from node distribution; < scaffold is snapped up to scaffold size
target_values: []
property_names: []
negative_target_values: []   # code default
batch_size: 1
seed: 86
n_frames: 0
max_mol_size: 0              # code default; 0 = no cap
save_xyzrender_figures: false # code default
output_path: generated_mol
condition_configs:
  reference_structure_path: ${asset:inputs/templates/CpHHH.xyz}
  condition_component: xh            # code default
  use_noised_conditioning: false     # code default
  n_retrys: 0
  t_retry: 180
  inpaint_cfgs:
    mask_node_index:
    - 5
    - 30
    - 31
    - 6
    - 7
    - 45
    - 8
    - 32
    - 9
    - 10
    - 33
    - 11
    - 34
    - 12
    - 35
    - 13
    - 36
    - 14
    - 15
    - 16
    - 17
    - 18
    - 37
    - 19
    - 38
    - 20
    - 39
    - 21
    - 40
    - 22
    - 23
    - 41
    - 24
    - 44
    - 25
    - 26
    - 43
    - 42
    denoising_strength: 0.75   # code default None; fraction of steps over which masked atoms are denoised
    constraint_strength: 0.8   # code default; overlap-push constraints for s < this value (0-1)
    scale_factor: 1.2          # code default 1.1; covalent-radius multiplier for bond-distance tolerance
    noise_initial_mask: False  # code default
    # --- extended-inpaint node placement (used only when target size > scaffold; code defaults) ---
    init_method: skeleton      # "skeleton" | "seed" | "fragment"
    skeleton_type: random_walk
    seed_dist: 2.0
    min_dist: 1.0
    spread: 1.0
    bond_len: 1.5
    forward_noise: jitter
    jitter_scale: 1.0         # explicit positional forward-noise magnitude
    n_bq_atom: 0
