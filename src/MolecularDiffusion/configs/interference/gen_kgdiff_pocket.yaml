# Pocket-conditioned generation for KGDiff.
#
# GenerativeFactory's sample(batch_size, nodesxsample, ...) has no channel for
# "which pocket", so pocket models bypass it. The reverse loop itself is
# shared: modules/tasks/pocket_generator.py::PocketGenerator owns it, and the
# `_target_` below is that model's thin subclass, which supplies only what
# genuinely differs (how the pocket is read, how it is tiled, its sampler
# kwargs). cli/generate.py only calls `instantiate(cfg.interference,
# task=task)` then `.run()`.
#
# THIS config exists for KGDiff's guidance knobs (guide_mode,
# type_grad_weight, pos_grad_weight), which the shared config cannot default.
# For a run needing none of that, interference/gen_pocket.yaml carries the
# nine keys every pocket model shares and picks the subclass off the task.
#
# There is no unconditional mode: KGDiff's network cannot run without
# protein_pos/protein_v.
_target_: MolecularDiffusion.modules.tasks.diffusion_kgdiff.KGDiffPocketGenerator

# A converted ASE db (docs/model_integrations/kgdiff/scripts/convert_dataset.py).
# Coordinates are never re-centred at load time -- ScorePosNet3D subtracts the
# pocket centroid internally (center_pos_mode: protein) and the sampler adds it
# back, so sampled ligands come back in this pocket's own frame.
pocket_db: ???
pocket_index: 0

num_generate: 20
batch_size: 4

# Reverse-process steps. null => the model's full schedule
# (tasks.num_diffusion_timesteps, 1000).
num_steps: null

# Empty => draw ligand sizes from KGDiff's pocket-size-conditioned prior
# (the static atom_num_config table -- no training data and no checkpoint
# buffer needed). A list => sample uniformly from it instead.
mol_size: []

# --- guidance ---------------------------------------------------------- #
# joint = KGDiff's headline self-guided sampler: the model's OWN affinity head
#         is the classifier guide, so one checkpoint does everything. The
#         posterior mean gains + pos_grad_weight * sigma_t * pos_grad and the
#         type logits gain + type_grad_weight * type_grad, i.e. it ascends
#         predicted affinity.
# wo    = the same reverse loop with guidance off (the paper's ablation, and a
#         useful control when judging whether guidance is doing anything).
# The valuenet*/target_diff modes each need a SECOND pretrained checkpoint and
# `vina` needs AutoDockTools; both are out of scope for this port.
guide_mode: joint

# Paper's CrossDocked settings.
type_grad_weight: 100.0
pos_grad_weight: 25.0

seed: 42
device: null                 # null => cuda if available
output_path: generated_kgdiff
