# DiffInt: DiffSBDD with explicit hydrogen-bond interaction nodes.
# See docs/model_integrations/diffint/INTEGRATION_PLAN.md.
#
# The backbone is 100 % the ported DiffSBDD ConditionalDDPM
# (modules/models/diffsbdd/). DiffInt's contribution is data-level: two
# pseudo-atoms per protein-ligand hydrogen bond are appended to the POCKET
# node set with two extra one-hot channels (DD, AC), which is the entire
# reason `residue_nf` is 22 and not 20. They are conditioning and are never
# diffused.
#
# Every value below is read off the RELEASED checkpoint
# (others/DiffInt/checkpoints/best_model.ckpt -> `hyper_parameters`), NOT off
# configs/DiffInt_ca_double.yml -- here the two happen to agree, but the
# checkpoint is the authority. Changing any architecture value makes the
# converted pretrained checkpoint unloadable.
_target_: MolecularDiffusion.modules.tasks.diffusion_diffint.ModelTaskFactory

task_type: diffusion_diffint

# Only pocket_conditioning weights were released, and DiffInt's forked
# inpaint() is broken upstream, so `joint` is out of scope for this port.
mode: pocket_conditioning

# --- node feature widths ---
# Ligand: the 10-class crossdock element vocabulary [C,N,O,S,B,Br,Cl,P,I,F],
#         hydrogens stripped (upstream preprocesses with --no_H).
# Pocket: CA representation, so 20 amino-acid classes, PLUS DD and AC for the
#         H-bond particles = 22 (constants.py:184, dataset_params
#         ['crossdock_h']['aa_decoder']). Confirmed against the weights:
#         residue_encoder.0.weight is (20, 22).
atom_nf: 10
residue_nf: 22
n_dims: 3

# --- EGNN backbone (hyper_parameters['egnn_params']) ---
joint_nf: 128
hidden_nf: 256
n_layers: 6
inv_sublayers: 1
attention: true
tanh: true
norm_constant: 1
sin_embedding: false
normalization_factor: 100
aggregation_method: sum
reflection_equivariant: false

# --- message-passing graph (geometric scaffolding, NOT a bond graph) ---
edge_cutoff_ligand: null      # null => fully connected within the ligand
edge_cutoff_pocket: 5.0
edge_cutoff_interaction: 5.0
edge_embedding_dim: null

# --- diffusion (hyper_parameters['diffusion_params']) ---
diffusion_steps: 500
diffusion_noise_schedule: polynomial_2
diffusion_noise_precision: 5.0e-4
# [x, h] -- note [1, 1], NOT DiffSBDD's [1, 4].
normalize_factors: [1, 1]

# --- ligand-size prior ---
# Shape of the 2D joint (n_ligand_atoms, n_pocket_RESIDUES) histogram buffer.
# The pocket axis counts residues only; the H-bond particles are excluded
# (dataset.py:65). (107, 113) is exactly the released checkpoint's
# `node_histogram` shape -- changing either bound makes it unloadable.
max_n_lig: 107
max_n_pocket: 113

atom_vocab: [C, N, O, S, B, Br, Cl, P, I, F]
