_target_: MolecularDiffusion.runmodes.train.ModelTaskFactory_EGCL
task_type: ssl3d
atom_vocab: ${data.atom_vocab}
condition_names: []
hidden_size: 256
act_fn:
  _target_: torch.nn.SiLU
num_layers: 4
attention: True
tanh: True
num_sublayers: 5
sin_embedding: False
aggregation_method: "sum"
dropout: 0.0
normalization: False
include_cosine: True
norm_constant: 1.0
normalization_factor: 1.0
chkpt_path: null

# SSL3D objectives
ssl3d_denoise_weight: 1.0
ssl3d_sigma_min: 0.01
ssl3d_sigma_max: 1.0
ssl3d_sigma_schedule: uniform    # uniform | log_uniform

ssl3d_mtype_weight: 0.5
ssl3d_mask_rate: 0.15
ssl3d_atom_vocab_size: 5         # QM9: H C N O F  (adjust for other datasets)

ssl3d_dist_weight: 0.0           # set > 0 to enable pairwise-distance objective
ssl3d_dist_k_pairs: 16
