# GCDM GEOM-Drugs preset. Differs from diffusion_gcdm.yaml only in the four
# fields GCDM itself changes between its QM9 and GEOM runs:
#   include_charges       true -> false  (edm_geom_dataloader.yaml:13)
#   num_encoder_layers    9 -> 4         (geom_mol_gen_ddpm_gcp_model.yaml)
#   e_hidden_dim          64 -> 16
#   xi_hidden_dim         16 -> 8
# Pair it with `data: gcdm_geom_dataset` so the 16-element atom vocabulary
# lines up with the published GEOM checkpoint's one-hot columns.
defaults:
  - diffusion_gcdm
  - _self_

include_charges: False
num_encoder_layers: 4
hidden_dims:
  h_hidden_dim: 256
  chi_hidden_dim: 32
  e_hidden_dim: 16
  xi_hidden_dim: 8
  chi_input_dim: 2
  e_input_dim: 1
  xi_input_dim: 1

# GCPNet is O(N^2) in atoms per sample and GEOM molecules reach 181 atoms, so
# evaluation batches must stay small.
n_samples: 8
batch_size: 2
